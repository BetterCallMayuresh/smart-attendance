services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: smartattend
      MYSQL_DATABASE: smart_attendance
    ports:
      - "3306:3306"
    volumes:
      - smartattend-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 8s
      timeout: 5s
      retries: 12

  presence:
    build: ./presence-service
    ports:
      - "3001:3001"
      - "3002:3002"

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      presence:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/smart_attendance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: smartattend
      JWT_SECRET: SmartAttendanceSecretKeyForJWTGenerationMustBeLongEnough256Bits!!
      PRESENCE_WS_URL: ws://presence:3002
      PRESENCE_REST_URL: http://presence:3001
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
        VITE_WS_URL: http://localhost:8080/ws
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  smartattend-mysql:
